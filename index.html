<!-- SIGNUP MODAL -->
<div class="modal" id="signupModal">

  <div class="video-auth-container">

    <video autoplay muted loop class="bg-video">
      <source src="https://cdn.coverr.co/videos/coverr-man-working-on-laptop-1560918348737/1080p.mp4" type="video/mp4">
    </video>

    <div class="video-overlay"></div>

    <div class="auth-box">

      <span class="close" onclick="closeSignup()">&times;</span>

      <h1>Create Account</h1>

      <input type="text" placeholder="Full Name">
      <input type="email" placeholder="Email Address">
      <input type="password" placeholder="Password">

      <button class="auth-main-btn">Create Account</button>

      <div class="social-login">

        <button class="google-btn">Google</button>
        <button class="facebook-btn">Facebook</button>
        <button class="linkedin-btn">LinkedIn</button>

      </div>

      <p class="switch-text">
        Already have an account?
        <span onclick="switchToLogin()">Sign In</span>
      </p>

    </div>

  </div>

</div>
